[package]
name = "mirage-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Mirage command-line interface: profiles, launch, proxy, cookies, import and fingerprints, talking to the crates directly (no server)"

[[bin]]
name = "mirage"
path = "src/main.rs"

[lib]
name = "mirage_cli"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
mirage-core = { path = "../mirage-core" }
mirage-vault = { path = "../mirage-vault" }
mirage-launcher = { path = "../mirage-launcher" }
mirage-proxy = { path = "../mirage-proxy" }
mirage-cookies = { path = "../mirage-cookies" }
mirage-import = { path = "../mirage-import" }

[dev-dependencies]
clap = { version = "4", features = ["derive", "env"] }
tempfile = "3"
