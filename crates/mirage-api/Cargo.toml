[package]
name = "mirage-api"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Mirage local REST API: native v1 endpoints plus AdsPower-compatible aliases"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

mirage-core = { path = "../mirage-core" }
mirage-vault = { path = "../mirage-vault" }
mirage-launcher = { path = "../mirage-launcher" }
mirage-proxy = { path = "../mirage-proxy" }
mirage-cookies = { path = "../mirage-cookies" }
mirage-import = { path = "../mirage-import" }

# In-process router tests drive the service with tower::ServiceExt::oneshot.
[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
