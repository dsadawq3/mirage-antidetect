[package]
name = "mirage-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Mirage fingerprint model, deterministic generator, consistency validator and fp-db access"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
thiserror = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
