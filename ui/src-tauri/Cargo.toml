[package]
name = "mirage-ui"
version = "0.1.0"
description = "Mirage desktop UI (Tauri 2 shell over the local Mirage REST API)"
edition = "2021"
rust-version = "1.77"
publish = false

# Own workspace so the heavy tauri tree never joins the repo's `cargo test --workspace`.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"

[features]
# Embed ../dist into the binary. Enabled by default so a plain `cargo run`
# works from any working directory without tauri-cli and without a dev server.
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
